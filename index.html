<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Plata en Orden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo app, con barra de secciones fija arriba; tarjetas solo donde marcan un objeto (cuentas, sobres, deudas, cajitas) */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --ink:#15201B; --muted:#5B6A63; --line:#D3DCD7;
  --jade:#0E7A5C; --jade-soft:#D5EEE5; --gold:#B87A00; --gold-soft:#FBEBC5; --red:#B93C27; --red-soft:#F7DCD5;
  --blue:#2C5F8A; --blue-soft:#DCE8F2;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(21,32,27,.06),0 4px 14px rgba(21,32,27,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#151E1A; --sunk:#1C2722; --ink:#E6EEEA; --muted:#93A59C; --line:#2A3832;
  --jade:#43C89E; --jade-soft:#173A2F; --gold:#F0B541; --gold-soft:#3A2F14; --red:#F07F68; --red-soft:#3E211B;
  --blue:#7FB1DB; --blue-soft:#1A2B3A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151E1A; --sunk:#1C2722; --ink:#E6EEEA; --muted:#93A59C; --line:#2A3832;
  --jade:#43C89E; --jade-soft:#173A2F; --gold:#F0B541; --gold-soft:#3A2F14; --red:#F07F68; --red-soft:#3E211B;
  --blue:#7FB1DB; --blue-soft:#1A2B3A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.35rem;font-weight:750;font-stretch:112%}
h3{font-size:1.02rem;font-weight:700;font-stretch:105%}
p{margin:0}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-stretch:100%}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* Header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-block:22px 14px}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:14px;border-radius:3px;background:var(--jade);position:relative}
.brand i::after{content:"";position:absolute;inset:3px 7px;border-radius:50%;border:2px solid var(--surface)}
.hello{font-size:.9rem;color:var(--muted)}
.sync{font-size:.75rem;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.sync.ok{background:var(--jade-soft);color:var(--jade)}

/* Nav */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
.tabrow{display:flex;gap:4px;max-width:980px;margin:0 auto;min-width:max-content}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:hover:not([aria-selected="true"]){background:var(--sunk);color:var(--ink)}

section.view{display:grid;gap:18px;padding-top:18px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0;align-content:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:grid;gap:10px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0D1311}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0D1311}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}

/* Hero */
.hero{background:var(--ink);color:var(--bg);border-radius:18px;padding:22px;display:grid;gap:18px;grid-template-columns:1.3fr 1fr;box-shadow:var(--shadow)}
.hero .label{color:inherit;opacity:.7}
.hero-big{font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:clamp(2.1rem,7vw,3.2rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.hero-side{display:grid;gap:12px;align-content:start;border-left:1px solid color-mix(in srgb,var(--bg) 20%,transparent);padding-left:18px}
.hero-side .num{font-size:1.3rem;font-weight:700}
.accts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acct{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:99px;background:color-mix(in srgb,var(--bg) 12%,transparent);font-size:.86rem}
.acct b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.acct button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:inherit;border-radius:99px;width:24px;height:24px;font-size:.75rem}
.acct.add{padding:6px 12px;border:1px dashed color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:inherit;cursor:pointer}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero-side{border-left:0;padding-left:0;border-top:1px solid color-mix(in srgb,var(--bg) 20%,transparent);padding-top:14px;grid-template-columns:1fr 1fr}}

/* Bars */
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--jade);transition:width .5s}
.bar.gold>span{background:var(--gold)}
.stacked{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}
.stacked span{height:100%;transition:flex-grow .3s}

/* Stats */
.stat .big{font-family:var(--f-display);font-weight:750;font-stretch:110%;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--jade-soft);color:var(--jade)}
.chip.warn{background:var(--gold-soft);color:var(--gold)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.chip.info{background:var(--blue-soft);color:var(--blue)}

/* Sobres */
.sobres{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.sobre{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;position:relative;background:var(--surface)}
.sobre::before{content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c,var(--jade))}
.sobre .num{font-size:1.35rem;font-weight:700}

/* Lists */
.list{display:grid;align-content:start}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .amt{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--jade)} .amt.out{color:var(--red)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;padding:0}
.check.on{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.check svg{width:14px;height:14px}
.done-text{text-decoration:line-through;color:var(--muted)}

/* Deudas */
.deuda{display:grid;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.deuda:first-child{border-top:0;padding-top:4px}
.deuda .num.big2{font-size:1.25rem;font-weight:700}

/* Forms */
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:1rem;min-width:0}
.input:focus{outline:2px solid var(--jade);outline-offset:0;border-color:transparent}
.money-in{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}

/* Quick income */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:grid;gap:2px}
.qbtn:hover{border-color:var(--jade);background:var(--jade-soft)}
.qbtn .num{font-size:1.2rem;font-weight:700}

/* Split preview */
.split{display:grid;gap:8px}
.split .li{padding:8px 0}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

/* Tip */
.tip{display:flex;gap:14px;align-items:flex-start;background:var(--blue-soft);color:var(--ink);border-radius:var(--r);padding:16px 18px}
.tip .ico{font-family:var(--f-display);font-weight:800;color:var(--blue);font-size:1.4rem;line-height:1}

/* Chart */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}

/* Aprende */
.levelbar{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.badge{width:74px;height:74px;border-radius:20px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-stretch:120%;font-size:1.6rem}
.mod{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mod>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:14px;align-items:center}
.mod>summary::-webkit-details-marker{display:none}
.mod .n{font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:1.3rem;color:var(--jade);width:30px}
.mod[open]>summary{border-bottom:1px solid var(--line)}
.mod-body{padding:18px;display:grid;gap:18px}
.lesson{max-width:68ch;display:grid;gap:8px}
.lesson li{margin-bottom:4px}
.q{display:grid;gap:10px;padding-top:14px;border-top:1px dashed var(--line)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--f-display);font-weight:800;width:22px;height:22px;border-radius:6px;background:var(--sunk);display:grid;place-items:center;flex:none;font-size:.8rem}
.opt.right{border-color:var(--jade);background:var(--jade-soft)}
.opt.right .k{background:var(--jade);color:var(--surface)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:var(--surface)}
.opt.meh{border-color:var(--gold);background:var(--gold-soft)}
.opt.meh .k{background:var(--gold);color:var(--surface)}
.explain{font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.scen{display:grid;gap:12px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.55);display:grid;place-items:end center;z-index:50;padding:16px}
@media (min-width:600px){.overlay{place-items:center}}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;width:min(460px,100%);max-height:90vh;overflow:auto;padding:20px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:60;max-width:calc(100% - 32px);text-align:center}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted)}
.celebrate{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
textarea.input{min-height:120px;font-family:ui-monospace,monospace;font-size:.8rem}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand"><i></i>Plata en Orden</div>
      <div class="hello" id="hello">Hola</div>
    </div>
    <span class="sync" id="sync">Cargando tus datos…</span>
  </header>
</div>
<nav class="tabs" aria-label="Secciones"><div class="tabrow" role="tablist" id="tabs"></div></nav>
<main class="wrap" id="app"></main>
<div id="layer"></div>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (n < 0 ? "-$" : "$") + Math.round(Math.abs(n)).toLocaleString("es-CO");
const parseMoney = s => Number(String(s ?? "").replace(/[^\d]/g, "")) || 0;
const uid = () => Math.random().toString(36).slice(2, 9);
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function hoyISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function diasEntre(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5);}
function diasHasta(iso){return iso ? diasEntre(hoyISO(), iso) : null;}
function fechaCorta(iso){if(!iso) return "Sin fecha";const [y,m,d]=iso.split("-").map(Number);return d+" "+MESES[m-1]+(y!==new Date().getFullYear()?" "+y:"");}
function mesMas(k){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+k);return {m:d.getMonth(),y:d.getFullYear()};}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pct=(a,b)=>b>0?clamp(a/b*100,0,100):0;
const ICON_CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

/* ---------- estado ---------- */
function estadoBase(){return {v:1,nombre:"",creado:hoyISO(),cuentas:[],cajitas:[],fondoId:null,deudas:[],
  sobres:{diezmo:0,comida:0,personal:0,deudas:0},
  reglas:{q:{diezmo:10,ahorro:10,comida:0},x:{diezmo:10,ahorro:10,personal:15}},
  fuentes:[],gastos:[],ingresos:[],movs:[],aprende:{r:{},e:{}}};}
function normalizar(s){const b=estadoBase();if(!s||typeof s!=="object")return b;
  const o=Object.assign(b,s);o.sobres=Object.assign(estadoBase().sobres,s.sobres||{});
  o.reglas={q:Object.assign(estadoBase().reglas.q,(s.reglas||{}).q||{}),x:Object.assign(estadoBase().reglas.x,(s.reglas||{}).x||{})};
  o.aprende=Object.assign({r:{},e:{}},s.aprende||{});
  ["cuentas","cajitas","deudas","fuentes","gastos","ingresos","movs"].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[];});
  return o;}
let state = estadoBase();
let cargado = false;
let tab = "inicio";
try{const t=localStorage.getItem("peo_tab");if(t)tab=t;}catch(e){}

/* ---------- guardado ---------- */
let dbRef = null, saveTimer = null, guardando = false, pendiente = false;
function setSync(txt, ok){const el=$("#sync");el.textContent=txt;el.className="sync"+(ok?" ok":"");}
function guardar(){
  try{localStorage.setItem("peo_state",JSON.stringify(state));}catch(e){}
  if(!dbRef){setSync("Guardado en este navegador",false);return;}
  clearTimeout(saveTimer);saveTimer=setTimeout(escribir,700);setSync("Guardando…",false);
}
async function escribir(){
  if(guardando){pendiente=true;return;}
  guardando=true;
  try{await dbRef.set({json:JSON.stringify(state),t:Date.now()});setSync("Guardado en tu cuenta",true);}
  catch(e){setSync("No se pudo guardar en la nube; quedó en este navegador",false);}
  guardando=false;
  if(pendiente){pendiente=false;escribir();}
}
function cambio(){render();guardar();}

/* ---------- cálculos ---------- */
const fondo = () => state.cajitas.find(c=>c.id===state.fondoId) || null;
const deudaTotal = () => state.deudas.reduce((a,d)=>a+d.total,0);
const deudaPagada = () => state.deudas.reduce((a,d)=>a+Math.min(d.pagado,d.total),0);
const deudaRestante = () => Math.max(0, deudaTotal()-deudaPagada());
const enCuentas = () => state.cuentas.reduce((a,c)=>a+c.saldo,0);
const enCajitas = () => state.cajitas.reduce((a,c)=>a+c.saldo,0);
const enSobres = () => Object.values(state.sobres).reduce((a,v)=>a+Math.max(0,v),0);

function calcularReparto(monto, tipo, sinTope){
  const R=state.reglas; monto=Math.max(0,Math.round(monto));
  let d=0,a=0,c=0,p=0;
  if(tipo==="q"){d=Math.round(monto*R.q.diezmo/100);a=Math.round(monto*R.q.ahorro/100);c=Math.min(R.q.comida,Math.max(0,monto-d-a));}
  else{d=Math.round(monto*R.x.diezmo/100);a=Math.round(monto*R.x.ahorro/100);p=Math.round(monto*R.x.personal/100);}
  let resto=Math.max(0,monto-d-a-c-p);
  let aDeuda=resto, aFondo=0;
  if(!sinTope){const falta=Math.max(0,deudaRestante()-Math.max(0,state.sobres.deudas));aDeuda=Math.min(resto,falta);aFondo=resto-aDeuda;}
  return {diezmo:d,ahorro:a,comida:c,personal:p,deudas:aDeuda,fondoExtra:aFondo,total:monto};
}
const PARTES=[
  {k:"diezmo",label:"Diezmo",c:"var(--blue)"},
  {k:"ahorro",label:"Ahorro → Fondo de emergencia",c:"var(--jade)"},
  {k:"comida",label:"Comida",c:"var(--gold)"},
  {k:"personal",label:"Gastos personales",c:"var(--muted)"},
  {k:"deudas",label:"Deudas",c:"var(--red)"},
  {k:"fondoExtra",label:"Fondo (deudas ya cubiertas)",c:"var(--jade)"}];

function aporteMensual(){
  let ahorro=0,deudas=0;
  state.fuentes.forEach(f=>{const r=calcularReparto(f.monto,f.tipo,true);const n=f.veces||1;ahorro+=r.ahorro*n;deudas+=r.deudas*n;});
  return {ahorro,deudas};
}
function proyectarFondo(){
  const f=fondo();if(!f)return null;
  const i=Math.pow(1+(f.tea||0)/100,1/12)-1, m=aporteMensual();
  let saldo=f.saldo, deuda=Math.max(0,deudaRestante()-Math.max(0,state.sobres.deudas));
  const pts=[{k:0,v:saldo}];let metaK=null,libreK=deuda===0?0:null;
  for(let k=1;k<=36;k++){
    saldo=saldo*(1+i)+m.ahorro;
    const pago=Math.min(m.deudas,deuda);deuda-=pago;saldo+=m.deudas-pago;
    if(libreK===null&&deuda<=0)libreK=k;
    pts.push({k,v:saldo});
    if(metaK===null&&f.meta&&saldo>=f.meta)metaK=k;
    if(metaK!==null&&k>=metaK+2&&k>=12)break;
  }
  return {pts,metaK,libreK,meta:f.meta,m};
}
function acumularRendimientos(){
  const hoy=hoyISO();let total=0;
  state.cajitas.forEach(c=>{
    if(!c.ultima){c.ultima=hoy;return;}
    const dias=diasEntre(c.ultima,hoy);
    if(dias>0){const g=c.saldo*(Math.pow(1+(c.tea||0)/100,dias/365)-1);c.saldo+=g;c.ganado=(c.ganado||0)+g;c.ultima=hoy;total+=g;}
  });
  if(total>=1)mov("Rendimientos de tus cajitas",total,"in");
  return total>0;
}
function mov(t,m,tipo){state.movs.unshift({id:uid(),f:hoyISO(),t,m:Math.round(m),tipo});if(state.movs.length>150)state.movs.length=150;}
function proximaDeuda(){
  return state.deudas.filter(d=>d.pagado<d.total).sort((a,b)=>(a.fecha||"9999")<(b.fecha||"9999")?-1:1)[0]||null;
}

function consejo(){
  const prox=proximaDeuda(), f=fondo();
  let t="";
  if(prox&&prox.fecha){const dd=diasHasta(prox.fecha), falta=prox.total-prox.pagado;
    const q=Math.max(1,Math.ceil(Math.max(dd,1)/15));
    t=dd<0?`<b>${esc(prox.nombre)}</b> está vencida. Llama o escribe hoy para acordar una nueva fecha; avisar antes de que crezca el problema siempre sale mejor.`
      :`Para pagar <b>${esc(prox.nombre)}</b> (${fmt(falta)}) en ${dd} días, aparta unos <b>${fmt(falta/q)}</b> por quincena desde el sobre de deudas.`;
  }else if(deudaRestante()===0&&f&&f.saldo<f.meta){t=`Ya no tienes deudas. Todo lo que antes iba a deudas ahora entra solo a tu fondo de emergencia. No saques créditos nuevos hasta llegar a ${fmt(f.meta)}.`;}
  else if(f&&f.saldo>=f.meta&&f.meta>0){t=`Tu fondo está completo. Desde aquí, lo que ahorres puede ir a una cajita de inversión o a hacer crecer tu negocio.`;}
  else t=`Cada peso extra que ganes: 10% diezmo, 10% ahorro, 15% para ti y el resto a deudas. Así la comida no crece cuando ganas más.`;
  return `<div class="tip"><div class="ico">→</div><p>${t}</p></div>`;
}
function graficoFondo(){
  const p=proyectarFondo();if(!p||!p.meta)return "";
  const W=Math.round(clamp(window.innerWidth-70,320,720)),H=W<500?220:240,L=56,R=14,T=18,B=34;
  const n=p.pts.length-1, maxV=Math.max(p.meta*1.08,...p.pts.map(x=>x.v));
  const x=k=>L+(W-L-R)*k/n, y=v=>T+(H-T-B)*(1-v/maxV);
  const path=p.pts.map((pt,i)=>(i?"L":"M")+x(pt.k).toFixed(1)+" "+y(pt.v).toFixed(1)).join(" ");
  const area=path+` L${x(n)} ${y(0)} L${x(0)} ${y(0)} Z`;
  const ticks=[0,.25,.5,.75,1].map(t=>maxV*t);
  const cols=Math.max(3,Math.floor((W-L-R)/58));const step=Math.max(1,Math.ceil(n/cols));
  let xl="";for(let k=0;k<=n;k+=step){const mm=mesMas(k);xl+=`<text x="${x(k)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${MESES[mm.m]}${mm.m===0||k===0?" "+String(mm.y).slice(2):""}</text>`;}
  const mk=p.metaK, lk=p.libreK;
  const mmeta=mk!==null?mesMas(mk):null;
  const resumen=mk!==null?`Con tu reparto actual llegas a ${fmt(p.meta)} en <b>${MESES_L[mmeta.m]} de ${mmeta.y}</b>${lk&&lk>0?`, después de terminar las deudas en ${MESES_L[mesMas(lk).m]}`:""}.`:`Con tu reparto actual aún no llegas a la meta en 3 años. Sube el ahorro o suma ingresos extra.`;
  return `<div class="card stack">
    <div class="head"><h2>¿Cuándo llego a mi fondo?</h2><span class="small muted">Ahorro ${fmt(p.m.ahorro)}/mes + lo de deudas cuando terminen</span></div>
    <p>${resumen}</p>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección del fondo de emergencia">
      ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1e6?(v/1e6).toFixed(1).replace(".",",")+" M":Math.round(v/1e3)+" mil"}</text>`).join("")}
      <path d="${area}" fill="var(--jade)" opacity=".12"/>
      <path d="${path}" fill="none" stroke="var(--jade)" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="${L}" x2="${W-R}" y1="${y(p.meta)}" y2="${y(p.meta)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${L+6}" y="${y(p.meta)-6}" text-anchor="start" font-size="11" font-weight="700" fill="var(--gold)">Meta ${fmt(p.meta)}</text>
      ${lk&&lk>0&&lk<=n?`<line x1="${x(lk)}" x2="${x(lk)}" y1="${T}" y2="${H-B}" stroke="var(--red)" stroke-width="1" stroke-dasharray="3 3"/><text x="${x(lk)+4}" y="${T+10}" font-size="11" fill="var(--red)">Sin deudas</text>`:""}
      ${mk!==null&&mk<=n?`<circle cx="${x(mk)}" cy="${y(p.pts[mk].v)}" r="5" fill="var(--jade)" stroke="var(--surface)" stroke-width="2"/>`:""}
      ${xl}
    </svg></div>
  </div>`;
}

function calcSim(){
  const o=$("#simOut");if(!o)return;

  const puesto=ini+mes*an*12, gan=s-puesto;
  o.innerHTML=`<div class="grid3" style="margin-top:4px">
    <div><div class="label">Tú pones</div><div class="num" style="font-size:1.4rem;font-weight:700">${fmt(puesto)}</div></div>

    <div class="stacked" style="margin-top:12px"><span style="flex-grow:${puesto};background:var(--blue)"></span><span style="flex-grow:${Math.max(gan,0)};background:var(--jade)"></span></div>

}

    </div>
    <div id="credOut"></div>
  </div>`;
}
function calcCredito(){
  const o=$("#credOut");if(!o)return;
  const M=parseMoney($("#cMonto").value),D=parseMoney($("#cDesc").value),tea=Number($("#cTea").value)||0,n=clamp(Math.round(Number($("#cMeses").value)||1),1,360);
  if(!M){o.innerHTML="";return;}
  const i=Math.pow(1+tea/100,1/12)-1;
  const cuota=i>0?M*i/(1-Math.pow(1+i,-n)):M/n;
  const rec=Math.max(1,M-D), total=cuota*n;
  let lo=0,hi=1;const fac=r=>r<1e-9?n:(1-Math.pow(1+r,-n))/r;
  if(rec>=total){lo=hi=0;}else{for(let k=0;k<100;k++){const mid=(lo+hi)/2;if(rec/cuota<fac(mid))lo=mid;else hi=mid;}}
  const real=(Math.pow(1+lo,12)-1)*100;
  const usura=28.79;
  o.innerHTML=`<div class="grid3" style="margin-top:4px">
    <div><div class="label">Cuota mensual</div><div class="num" style="font-size:1.4rem;font-weight:700">${fmt(cuota)}</div></div>
    <div><div class="label">Recibes / Pagas en total</div><div class="num" style="font-size:1.4rem;font-weight:700">${fmt(rec)} / ${fmt(total)}</div></div>
    <div><div class="label">Costo real E.A.</div><div class="num" style="font-size:1.4rem;font-weight:700;color:${real>tea+0.5?"var(--red)":"var(--jade)"}">${real.toFixed(1).replace(".",",")}%</div></div></div>
    <p class="small" style="margin-top:10px">${D>0?`Te anunciaron ${String(tea).replace(".",",")}%, pero como solo recibiste ${fmt(rec)}, el crédito te cuesta en realidad <b>${real.toFixed(1).replace(".",",")}% E.A.</b> Pagas ${fmt(total-rec)} por usar esa plata.`:`Pagas ${fmt(total-M)} en intereses por usar esa plata.`}
    ${real>usura?` <b style="color:var(--red)">Supera la tasa de usura de referencia (${String(usura).replace(".",",")}% E.A. a mitad de 2026); confírmala con la Superfinanciera.</b>`:""}</p>`;
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{

  if(t.dataset.tab||t.dataset.go){tab=t.dataset.tab||t.dataset.go;try{localStorage.setItem("peo_tab",tab);}catch(_){}render();window.scrollTo({top:0});return;}
  if(t.dataset.rtipo){rTipo=t.dataset.rtipo;document.querySelectorAll("#rSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.rtipo===rTipo));actualizarPreview();return;}
  const a=t.dataset.act,id=t.dataset.id;
  const find=(arr)=>state[arr].find(x=>x.id===id);
  switch(a){
    case "cuenta-add":modal({titulo:"Nueva cuenta",texto:"Una cuenta de banco, Nequi, Daviplata o efectivo.",campos:[{label:"Nombre",valor:"",ph:"Ej: Nequi"},{label:"Saldo hoy",tipo:"money"}]},v=>{if(!v[0]){toast("Ponle un nombre.");return false;}state.cuentas.push({id:uid(),nombre:v[0],saldo:v[1]});cambio();});break;
    case "cuenta-edit":{const c=find("cuentas");modal({titulo:"Editar "+c.nombre,campos:[{label:"Nombre",valor:c.nombre},{label:"Saldo hoy",tipo:"money",valor:c.saldo}],extra:`<button class="btn danger sm" id="mDel" style="justify-self:start">Eliminar cuenta</button>`},v=>{c.nombre=v[0]||c.nombre;c.saldo=v[1];cambio();});
      $("#mDel").onclick=()=>{state.cuentas=state.cuentas.filter(x=>x.id!==id);$("#layer").innerHTML="";cambio();toast("Cuenta eliminada");};break;}
    case "sobre-usar":{const k=t.dataset.k;const nom={diezmo:"diezmo",comida:"comida",personal:"gastos personales"}[k];
      modal({titulo:k==="diezmo"?"Entregar diezmo":"Registrar gasto de "+nom,texto:`Tienes ${fmt(state.sobres[k])} en este sobre.`,campos:[{label:"Monto",tipo:"money",valor:state.sobres[k]},{label:"Nota (opcional)",valor:""}],ok:"Registrar"},v=>{
        if(v[0]<=0){toast("Escribe un monto.");return false;}const m=Math.min(v[0],Math.max(0,state.sobres[k]));state.sobres[k]-=m;mov((k==="diezmo"?"Diezmo entregado":"Gasto: "+nom)+(v[1]?" · "+v[1]:""),m,"out");cambio();});break;}
    case "ir-deudas":tab="deudas";render();window.scrollTo({top:0});break;
    case "gasto-toggle":{const g=find("gastos");const mes=hoyISO().slice(0,7);g.mes=g.mes===mes?"":mes;if(g.mes)mov("Pagado: "+g.nombre,g.monto,"out");cambio();break;}
    case "fuente-cobrar":{const f=find("fuentes");registrarIngreso(f.monto,f.tipo,f.nombre);break;}
    case "reparto-registrar":{const m=parseMoney($("#rMonto").value);if(registrarIngreso(m,rTipo,$("#rDesc").value.trim())){}break;}
    case "ingreso-borrar":{const i=find("ingresos");
      modal({titulo:"Deshacer ingreso",texto:`Se quita ${fmt(i.monto)} y se devuelve lo que se repartió a sobres y fondo.`,ok:"Deshacer",peligro:true},()=>{
        state.sobres.diezmo-=i.r.diezmo;state.sobres.comida-=i.r.comida;state.sobres.personal-=i.r.personal;state.sobres.deudas-=i.r.deudas;
        const f=fondo();if(f)f.saldo=Math.max(0,f.saldo-i.r.ahorro-i.r.fondoExtra);
        Object.keys(state.sobres).forEach(k=>{if(state.sobres[k]<0)state.sobres[k]=0;});
        state.ingresos=state.ingresos.filter(x=>x.id!==id);mov("Deshecho: "+i.desc,i.monto,"out");cambio();});break;}
    case "deuda-add":modal({titulo:"Nueva deuda",campos:[{label:"¿A quién o qué?",ph:"Ej: Capital del iPhone"},{label:"Monto total",tipo:"money"},{label:"Fecha límite (opcional)",tipo:"date"},{label:"Nota (opcional)",ph:"Ej: tasa 25% E.A."}]},v=>{
      if(!v[0]||!v[1]){toast("Pon nombre y monto.");return false;}state.deudas.push({id:uid(),nombre:v[0],total:v[1],pagado:0,fecha:v[2],nota:v[3]});cambio();});break;
    case "deuda-edit":{const d=find("deudas");modal({titulo:"Editar deuda",campos:[{label:"Nombre",valor:d.nombre},{label:"Monto total",tipo:"money",valor:d.total},{label:"Ya pagado",tipo:"money",valor:d.pagado},{label:"Fecha límite",tipo:"date",valor:d.fecha},{label:"Nota",valor:d.nota||""}]},v=>{
      d.nombre=v[0]||d.nombre;d.total=v[1]||d.total;d.pagado=Math.min(v[2],d.total);d.fecha=v[3];d.nota=v[4];cambio();});break;}
    case "deuda-borrar":{const d=find("deudas");modal({titulo:"Eliminar deuda",texto:`¿Quitar “${esc(d.nombre)}” de la lista?`,ok:"Eliminar",peligro:true},()=>{state.deudas=state.deudas.filter(x=>x.id!==id);cambio();});break;}
    case "deuda-abonar":{const d=find("deudas");const falta=d.total-d.pagado;const sob=Math.max(0,state.sobres.deudas);
      modal({titulo:"Abonar a "+d.nombre,texto:`Te falta ${fmt(falta)}. En el sobre de deudas tienes ${fmt(sob)}; el abono sale primero de ahí.`,campos:[{label:"Monto del abono",tipo:"money",valor:Math.min(falta,sob)||""}],ok:"Abonar"},v=>{
        const m=Math.min(v[0],falta);if(m<=0){toast("Escribe un monto.");return false;}
        d.pagado+=m;state.sobres.deudas=Math.max(0,state.sobres.deudas-m);mov("Abono: "+d.nombre,m,"out");
        cambio();toast(d.pagado>=d.total?"¡Pagaste "+d.nombre+" completa!":"Abono registrado. Faltan "+fmt(d.total-d.pagado)+".");});break;}
    case "cajita-add":modal({titulo:"Nueva cajita",campos:[{label:"Nombre",ph:"Ej: Viaje, Negocio"},{label:"Saldo inicial",tipo:"money"},{label:"Tasa efectiva anual (%)",tipo:"number",ph:"Ej: 9"},{label:"Meta (opcional)",tipo:"money"}]},v=>{
      if(!v[0]){toast("Ponle un nombre.");return false;}state.cajitas.push({id:uid(),nombre:v[0],saldo:v[1],tea:v[2],meta:v[3],ultima:hoyISO(),ganado:0});cambio();});break;
    case "cajita-dep":case "cajita-ret":{const c=find("cajitas");const dep=a==="cajita-dep";
      modal({titulo:(dep?"Depositar en ":"Retirar de ")+c.nombre,texto:dep?"":`Disponible: ${fmt(c.saldo)}`,campos:[{label:"Monto",tipo:"money"}],ok:dep?"Depositar":"Retirar"},v=>{
        let m=v[0];if(m<=0){toast("Escribe un monto.");return false;}if(!dep)m=Math.min(m,c.saldo);c.saldo+=dep?m:-m;mov((dep?"Depósito a ":"Retiro de ")+c.nombre,m,dep?"neutral":"out");cambio();});break;}
    case "cajita-edit":{const c=find("cajitas");const esF=c.id===state.fondoId;
      modal({titulo:"Editar cajita",campos:[{label:"Nombre",valor:c.nombre},{label:"Tasa efectiva anual (%)",tipo:"number",valor:c.tea,ayuda:"Búscala en tu banco o app, por ejemplo la tasa E.A. de tu cuenta de ahorros."},{label:"Meta",tipo:"money",valor:c.meta},{label:"Saldo actual",tipo:"money",valor:c.saldo}],
        extra:`<div class="row">${esF?"":`<button class="btn sm" id="mFondo">Usar como fondo de emergencia</button>`}<button class="btn danger sm" id="mDel">Eliminar</button></div>`},v=>{c.nombre=v[0]||c.nombre;c.tea=v[1];c.meta=v[2];c.saldo=v[3];cambio();});
      $("#mDel").onclick=()=>{state.cajitas=state.cajitas.filter(x=>x.id!==id);if(esF)state.fondoId=null;$("#layer").innerHTML="";cambio();toast("Cajita eliminada");};
      const mf=$("#mFondo");if(mf)mf.onclick=()=>{state.fondoId=id;$("#layer").innerHTML="";cambio();toast(c.nombre+" es ahora tu fondo de emergencia");};break;}
    case "quiz":{const k=t.dataset.m+"-"+t.dataset.q;state.aprende.r[k]=Number(t.dataset.o);const ok=Number(t.dataset.o)===MODULOS[t.dataset.m].q[t.dataset.q][2];
      abiertos.add(t.dataset.m);const y=window.scrollY;cambio();window.scrollTo({top:y});toast(ok?"¡Correcto!":"Revisa la explicación");break;}
    case "quiz-reset":{const m=t.dataset.m;Object.keys(state.aprende.r).forEach(k=>{if(k.startsWith(m+"-"))delete state.aprende.r[k];});abiertos.add(m);const y=window.scrollY;cambio();window.scrollTo({top:y});break;}
    case "esc":{state.aprende.e[t.dataset.s]=Number(t.dataset.o);const y=window.scrollY;cambio();window.scrollTo({top:y});break;}
    case "esc-reset":state.aprende.e={};cambio();break;
    case "nombre-save":state.nombre=$("#aNombre").value.trim();cambio();toast("Listo");break;
    case "fuente-add":case "fuente-edit":{const f=a==="fuente-edit"?find("fuentes"):null;
      modal({titulo:f?"Editar fuente":"Nueva fuente de ingreso",campos:[{label:"Nombre",valor:f?f.nombre:"",ph:"Ej: Quincena Colchones León"},{label:"Monto cada vez",tipo:"money",valor:f?f.monto:0},
        {label:"Tipo",tipo:"select",valor:f?f.tipo:"x",opciones:[{v:"q",t:"Quincena del trabajo"},{v:"x",t:"Ingreso extra"}]},{label:"Veces al mes",tipo:"number",valor:f?f.veces:1}],
        extra:f?`<button class="btn danger sm" id="mDel" style="justify-self:start">Eliminar</button>`:""},v=>{
        if(!v[0]||!v[1]){toast("Pon nombre y monto.");return false;}const o={nombre:v[0],monto:v[1],tipo:v[2],veces:clamp(Math.round(v[3])||1,1,31)};
        if(f)Object.assign(f,o);else state.fuentes.push(Object.assign({id:uid()},o));cambio();});
      if(f)$("#mDel").onclick=()=>{state.fuentes=state.fuentes.filter(x=>x.id!==id);$("#layer").innerHTML="";cambio();};break;}
    case "reglas-save":{const n=s=>Math.max(0,Number($(s).value)||0);
      const q={diezmo:n("#rqD"),ahorro:Math.max(10,n("#rqA")),comida:parseMoney($("#rqC").value)},x={diezmo:n("#rxD"),ahorro:Math.max(10,n("#rxA")),personal:n("#rxP")};
      if(q.diezmo+q.ahorro>100||x.diezmo+x.ahorro+x.personal>100){toast("Los porcentajes suman más de 100%.");break;}
      state.reglas={q,x};cambio();toast("Reglas guardadas");break;}
    case "gasto-add":case "gasto-edit":{const g=a==="gasto-edit"?find("gastos"):null;
      modal({titulo:g?"Editar gasto":"Nuevo gasto fijo",campos:[{label:"Nombre",valor:g?g.nombre:""},{label:"Monto al mes",tipo:"money",valor:g?g.monto:0}],extra:g?`<button class="btn danger sm" id="mDel" style="justify-self:start">Eliminar</button>`:""},v=>{
        if(!v[0]){toast("Ponle un nombre.");return false;}if(g){g.nombre=v[0];g.monto=v[1];}else state.gastos.push({id:uid(),nombre:v[0],monto:v[1],mes:""});cambio();});
      if(g)$("#mDel").onclick=()=>{state.gastos=state.gastos.filter(x=>x.id!==id);$("#layer").innerHTML="";cambio();};break;}
    case "backup-copy":{const txt=JSON.stringify(state);
      navigator.clipboard.writeText(txt).then(()=>toast("Datos copiados")).catch(()=>{modal({titulo:"Copia tus datos",texto:"Selecciona todo el texto y cópialo.",extra:`<textarea class="input" readonly>${esc(txt)}</textarea>`,ok:"Cerrar"},()=>{});});break;}
    case "backup-import":modal({titulo:"Pegar una copia",texto:"Esto reemplaza todos tus datos actuales.",extra:`<textarea class="input" id="mImp" placeholder="Pega aquí tu copia"></textarea>`,ok:"Reemplazar",peligro:true},()=>{
      try{const s=JSON.parse($("#mImp").value);if(!s||!Array.isArray(s.deudas))throw 0;state=normalizar(s);cambio();toast("Datos restaurados");}catch(_){toast("Esa copia no se pudo leer.");return false;}});break;
    case "reset":modal({titulo:"Borrar todo",texto:"Se borran cuentas, deudas, cajitas, ingresos y tu progreso del curso. No se puede deshacer.",ok:"Borrar todo",peligro:true},()=>{const n=state.nombre;state=estadoBase();state.nombre=n;cambio();toast("Datos borrados");});break;
  }
});

/* ---------- arranque ---------- */
function usarEstado(s){state=normalizar(s);cargado=true;const cambio_=acumularRendimientos();render();return cambio_;}
(function inicio(){
  let local=null;try{const t=localStorage.getItem("peo_state");if(t)local=JSON.parse(t);}catch(e){}
  if(local){usarEstado(local);setSync("Conectando…",false);}else render();
  const cl=window.claude;
  if(!cl||!cl.use){if(!local){usarEstado(estadoBase());}setSync("Guardado en este navegador",false);return;}
  (async()=>{
    try{
      const [db,user]=await Promise.all([cl.use("db"),cl.use("user")]);
      const id=user?await user.id():null;
      if(!db||!id){if(!local)usarEstado(estadoBase());setSync("Guardado en este navegador",false);return;}
      dbRef=db.doc("data/users/"+id+"/finanzas");
      const snap=await dbRef.get();
      if(snap.exists){const d=snap.data();let s=null;try{s=JSON.parse(d.json);}catch(e){}
        const changed=usarEstado(s);setSync("Guardado en tu cuenta",true);if(changed)guardar();}
      else{
        let semilla=null;try{const sd=await db.doc("semilla/inicial").get();if(sd.exists)semilla=JSON.parse(sd.data().json);}catch(e){}
        usarEstado(local||semilla||estadoBase());
        setSync("Guardado en tu cuenta",true);
      }
    }catch(e){if(!cargado)usarEstado(local||estadoBase());setSync("Guardado en este navegador",false);}
  })();
})();
})();
